name: Build Debug APKs

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
         packages: 'platform-tools'

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Run Tests
        run: ./gradlew --no-daemon test

      - name: Build Debug APKs
        run: ./gradlew --no-daemon assembleDebug :app:assembleDebugMagiskModuleDir

      - name: Copy Artifacts
        run: |
          find . -name 'app*-debug.apk' -exec cp {} . \;
          cp -r app/build/magisk/debug ./magisk-debug

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Debug APKs
          path: app*-debug.apk
          if-no-files-found: error

      - name: Upload Magisk Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: magisk-debug
          path: magisk-debug
          if-no-files-found: error
